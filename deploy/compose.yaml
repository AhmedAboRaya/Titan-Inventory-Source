name: titan-inventory
services:
  db:
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    restart: unless-stopped
    mem_limit: 384m
    cpu_shares: 512
    pids_limit: 128
    command: [postgres, -c, shared_buffers=96MB, -c, max_connections=30]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --data-checksums --auth-host=scram-sha-256
    secrets: [postgres_password, inventory_password]
    volumes:
      - inventory-db:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-inventory.sh:ro
    networks: [private]
    shm_size: 128mb
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d titan_inventory"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: [no-new-privileges:true]
  api:
    image: titan-inventory:${INVENTORY_IMAGE_TAG:?Set an immutable Inventory release tag}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: runtime
    restart: unless-stopped
    mem_limit: 512m
    cpu_shares: 512
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    depends_on:
      db:
        condition: service_healthy
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the approved HTTPS Inventory origin}
      BASE_PATH: /inventory
      BIND: 0.0.0.0
      PORT: "8080"
      PUBLIC_DIR: /app/public
      ATTACHMENT_ROOT: /data/attachments
      INVENTORY_PASSWORD_FILE: /run/secrets/inventory_password
      TZ: Africa/Cairo
      NODE_OPTIONS: --max-old-space-size=320
    secrets: [inventory_password, inventory_setup]
    volumes: [inventory-files:/data]
    networks:
      private:
      gateway:
        aliases: [titan-inventory-api]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080'+(process.env.BASE_PATH||'')+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  backup:
    profiles: [maintenance]
    mem_limit: 512m
    cpu_shares: 512
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "2"}
    image: titan-inventory-tools:${INVENTORY_IMAGE_TAG:?Set an immutable Inventory release tag}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: maintenance
    depends_on:
      db:
        condition: service_healthy
    secrets: [inventory_password]
    volumes:
      - inventory-files:/data:ro
      - ./backups:/backups
    networks: [private]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
secrets:
  postgres_password:
    file: ./.secrets/postgres_password.txt
  inventory_password:
    file: ./.secrets/inventory_password.txt
  inventory_setup:
    file: ./.secrets/inventory_setup.txt
volumes:
  inventory-db:
  inventory-files:
networks:
  private:
    internal: true
  gateway:
    internal: true
    name: ${INVENTORY_GATEWAY_NETWORK:-titan-inventory-proxy}
